<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/sedema-design-system-22c075d0-d127-42cf-a894-cd82dba2a66d/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/sedema-design-system-22c075d0-d127-42cf-a894-cd82dba2a66d/tokens/colors.css">
  <link rel="stylesheet" href="_ds/sedema-design-system-22c075d0-d127-42cf-a894-cd82dba2a66d/tokens/typography.css">
  <link rel="stylesheet" href="_ds/sedema-design-system-22c075d0-d127-42cf-a894-cd82dba2a66d/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/sedema-design-system-22c075d0-d127-42cf-a894-cd82dba2a66d/tokens/base.css">
  <link rel="stylesheet" href="_ds/sedema-design-system-22c075d0-d127-42cf-a894-cd82dba2a66d/styles.css">
  <script src="_ds/sedema-design-system-22c075d0-d127-42cf-a894-cd82dba2a66d/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--blanco); color: var(--gris-100); font-family: Roboto, system-ui, sans-serif; }
    a { color: var(--guinda-100); }
    *:focus-visible { outline: 3px solid var(--guinda-100); outline-offset: 2px; }
    .om-nav-movil { display: none; }
    @media (max-width: 640px) {
      .om-divisor { display: none !important; }
      .om-buscador { margin-left: 0 !important; max-width: 100% !important; flex: 1 1 100% !important; }
    }
    @media (max-width: 860px) {
      .om-nav-ancha { display: none !important; }
      .om-nav-movil { display: block; }
    }
  </style>
</helmet>

<div style="background: var(--blanco)">

  <a href="#contenido" style="position: absolute; left: -9999px; top: 0; z-index: 60; background: var(--guinda-100); color: var(--blanco); padding: 12px 20px; font-size: 16px; font-weight: 700; text-decoration: none" style-focus="left: 0">Saltar al contenido</a>

  <header style="border-bottom: 1px solid var(--gris-20)">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; gap: clamp(14px, 2vw, 24px); flex-wrap: wrap">
      <a href="portada.dc.html" style="display: block; text-decoration: none">
        <img src="assets/logos/firma-sedema-rgb.jpg" alt="Gobierno de la Ciudad de México · Secretaría del Medio Ambiente" style="height: clamp(38px, 5vw, 50px); width: auto; display: block">
      </a>
      <div class="om-divisor" style="width: 1px; height: 44px; background: var(--gris-20)"></div>
      <div>
        <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gris-100); font-weight: 700">Guía ciudadana</div>
        <div style="font-size: clamp(18px, 2.2vw, 21px); font-weight: 700; color: var(--guinda-100); line-height: 1.2">El ABC del arbolado urbano</div>
      </div>
      <search class="om-buscador" style="margin-left: auto; flex: 1 1 260px; max-width: 400px; position: relative">
        <label for="buscador-sitio" style="display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--gris-100); margin-bottom: 6px">Buscar en el sitio</label>
        <input type="search" id="buscador-sitio" value="{{ q }}" onChange="{{ escribir }}" placeholder="poda, denuncia, permiso, vivero" autocomplete="off" aria-expanded="{{ abierto }}" aria-controls="resultados-sitio" style="width: 100%; box-sizing: border-box; font-family: Roboto, sans-serif; font-size: 16px; padding: 11px 14px; border: 1px solid var(--gris-40); border-radius: 4px; min-height: 44px; background: var(--blanco); color: var(--gris-100)">
        <sc-if value="{{ abierto }}" hint-placeholder-val="{{ false }}">
          <div id="resultados-sitio" style="position: absolute; top: 100%; left: 0; right: 0; z-index: 50; margin-top: 4px; background: var(--blanco); border: 1px solid var(--gris-40); box-shadow: 0 8px 20px rgba(26,26,26,0.16); max-height: 62vh; overflow-y: auto">
            <sc-if value="{{ hayResultados }}" hint-placeholder-val="{{ true }}">
              <ul style="list-style: none; margin: 0; padding: 0">
                <sc-for list="{{ resultados }}" as="r" hint-placeholder-count="4">
                  <li style="border-bottom: 1px solid var(--gris-20)">
                    <a href="{{ r.href }}" style="display: block; padding: 13px 16px; text-decoration: none; color: var(--gris-100); transition: background 150ms ease" style-hover="background: var(--marfil); color: var(--guinda-100)">
                      <span style="display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--gris-100)">{{ r.seccion }}</span>
                      <span style="display: block; font-size: 17px; font-weight: 700; color: var(--guinda-100); line-height: 1.3; margin-top: 2px">{{ r.titulo }}</span>
                      <span style="display: block; font-size: 15px; line-height: 1.45; margin-top: 2px">{{ r.detalle }}</span>
                    </a>
                  </li>
                </sc-for>
              </ul>
            </sc-if>
            <sc-if value="{{ sinResultados }}" hint-placeholder-val="{{ false }}">
              <p style="margin: 0; padding: 16px; font-size: 16px; line-height: 1.55; color: var(--gris-100)">No encontramos esa palabra. Prueba con poda, derribo, permiso, denuncia, vivero o el nombre de tu alcaldía.</p>
            </sc-if>
          </div>
        </sc-if>
      </search>
    </div>
    <nav aria-label="Navegación principal" style="border-top: 1px solid var(--gris-20); background: var(--gris-10)">
      <div class="om-nav-ancha" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap">
        <sc-for list="{{ secciones }}" as="s" hint-placeholder-count="7">
          <a href="{{ s.href }}" aria-current="{{ s.actual }}" style="padding: 15px 18px; font-size: 16px; font-weight: 700; color: {{ s.color }}; text-decoration: none; border-bottom: 3px solid {{ s.borde }}; background: {{ s.fondo }}; transition: background 150ms ease, color 150ms ease" style-hover="background: var(--blanco); color: var(--guinda-100)">{{ s.etiqueta }}</a>
        </sc-for>
      </div>

      <div class="om-nav-movil" style="max-width: 1240px; margin: 0 auto; padding: 10px 20px">
        <button onClick="{{ alternarMenu }}" aria-expanded="{{ menuAbierto }}" aria-controls="menu-movil" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 52px; padding: 12px 16px; background: var(--blanco); border: 1px solid var(--gris-40); border-radius: 4px; font-family: Roboto, sans-serif; font-size: 17px; font-weight: 700; color: var(--guinda-100); cursor: pointer; transition: background 150ms ease" style-hover="background: var(--marfil)">
          <span style="display: flex; align-items: center; gap: 12px">
            <span aria-hidden="true" style="display: flex; flex-direction: column; gap: 4px; flex: none">
              <span style="display: block; width: 20px; height: 2px; background: var(--guinda-100)"></span>
              <span style="display: block; width: 20px; height: 2px; background: var(--guinda-100)"></span>
              <span style="display: block; width: 20px; height: 2px; background: var(--guinda-100)"></span>
            </span>
            <span>{{ etiquetaMenu }}</span>
          </span>
          <span aria-hidden="true" style="font-size: 15px; color: var(--gris-100)">{{ signoMenu }}</span>
        </button>

        <sc-if value="{{ menuAbierto }}" hint-placeholder-val="{{ false }}">
          <ul id="menu-movil" style="list-style: none; margin: 10px 0 0; padding: 0; background: var(--blanco); border: 1px solid var(--gris-40); border-radius: 4px; overflow: hidden">
            <sc-for list="{{ secciones }}" as="s" hint-placeholder-count="7">
              <li style="border-bottom: 1px solid var(--gris-20)">
                <a href="{{ s.href }}" aria-current="{{ s.actual }}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 14px 18px; font-size: 17px; font-weight: 700; text-decoration: none; color: {{ s.color }}; border-left: 4px solid {{ s.borde }}; background: {{ s.fondo }}">
                  <span>{{ s.etiqueta }}</span>
                  <span aria-hidden="true" style="color: var(--dorado-100)">›</span>
                </a>
              </li>
            </sc-for>
          </ul>
        </sc-if>
      </div>
    </nav>
  </header>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:190},&quot;activo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;hazlo&quot;,&quot;responsabilidades&quot;,&quot;emergencias&quot;,&quot;patrimoniales&quot;,&quot;directorio&quot;,&quot;politica&quot;,&quot;ninguno&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;conEmergencia&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const SECCIONES = [
  { id: "inicio", etiqueta: "Inicio", href: "portada.dc.html" },
  { id: "hazlo", etiqueta: "Qué necesito hacer", href: "hazlo.dc.html" },
  { id: "responsabilidades", etiqueta: "Responsabilidades", href: "responsabilidades.dc.html" },
  { id: "emergencias", etiqueta: "Emergencias", href: "emergencias.dc.html" },
  { id: "programas", etiqueta: "Programas", href: "programas.dc.html" },
  { id: "directorio", etiqueta: "Directorio", href: "directorio.dc.html" },
  { id: "politica", etiqueta: "Política de arbolado", href: "politica.dc.html" }
];

const INDICE = [
  { seccion: "Qué necesito hacer", titulo: "Resuelve tu caso en dos preguntas", detalle: "Te dice a quién acudir y qué documentos reunir", href: "hazlo.dc.html#decisiones", claves: "asistente decisiones caso permiso autorizacion tramite quien autoriza" },
  { seccion: "Qué necesito hacer", titulo: "Poda", detalle: "Plazos, pasos y fundamento del procedimiento", href: "hazlo.dc.html#procedimientos", claves: "poda podar rama ramas mantenimiento 25 por ciento desmoche" },
  { seccion: "Qué necesito hacer", titulo: "Derribo", detalle: "Los cuatro supuestos y la restitución", href: "hazlo.dc.html#procedimientos", claves: "derribo derribar talar tala quitar arbol muerto riesgo restitucion" },
  { seccion: "Qué necesito hacer", titulo: "Trasplante", detalle: "Cuándo es viable mover un ejemplar", href: "hazlo.dc.html#procedimientos", claves: "trasplante trasplantar mover reubicar obra construccion" },
  { seccion: "Qué necesito hacer", titulo: "Casos cotidianos", detalle: "Diez situaciones reales con su salida", href: "hazlo.dc.html#casos", claves: "casos raices banqueta vecino jardin hojas cochera cables plaga" },
  { seccion: "Qué necesito hacer", titulo: "Preguntas frecuentes", detalle: "Veinte preguntas con fundamento", href: "hazlo.dc.html#faq", claves: "preguntas dudas faq cuanto cuesta cuanto tarda multa" },
  { seccion: "Responsabilidades", titulo: "Quién autoriza qué", detalle: "Matriz de SEDEMA, alcaldías, PAOT y Fiscalía", href: "responsabilidades.dc.html", claves: "competencias autoridad alcaldia sedema paot fiscalia bomberos sobse quien" },
  { seccion: "Responsabilidades", titulo: "Verificar una acreditación", detalle: "Consulta el padrón de podadores y dictaminadores", href: "responsabilidades.dc.html#verificador", claves: "verificar credencial padron podador dictaminador folio acreditacion estafa" },
  { seccion: "Responsabilidades", titulo: "Quiero acreditarme", detalle: "Requisitos y trámite de podador o dictaminador", href: "acreditate.dc.html", claves: "acreditarme acreditacion curso requisitos podador dictaminador trabajar" },
  { seccion: "Emergencias", titulo: "Árbol caído o a punto de caer", detalle: "Los tres niveles y a quién llamar", href: "emergencias.dc.html", claves: "emergencia caido cayo riesgo urgente 911 bomberos cable inclinado tormenta" },
  { seccion: "Emergencias", titulo: "Denunciar una poda irregular", detalle: "La denuncia ante PAOT puede ser anónima", href: "emergencias.dc.html", claves: "denuncia denunciar irregular sin permiso paot anonima testigo" },
  { seccion: "Programas", titulo: "Árboles patrimoniales", detalle: "Criterios, régimen y cómo proponer un ejemplar", href: "https://guardianesdeltiempo.sedema.cdmx.gob.mx", claves: "patrimonial patrimoniales ahuehuete antiguo historico proponer guardianes" },
  { seccion: "Programas", titulo: "Reforestación urbana", detalle: "Priorización con enfoque de justicia ambiental y avance", href: "reforestacion.dc.html", claves: "reforestacion plantar plantacion jornada sombra justicia ambiental avance adoptar" },
  { seccion: "Programas", titulo: "Retiro y sustitución de palmeras", detalle: "Por qué se retiran y qué se planta después", href: "palmeras.dc.html", claves: "palmera palmeras retiro sustitucion plaga picudo" },
  { seccion: "Programas", titulo: "Inventario del arbolado", detalle: "Qué datos se levantan y para qué sirven", href: "inventario.dc.html", claves: "inventario censo datos abiertos ejemplares registro" },
  { seccion: "Programas", titulo: "Viveros de la ciudad", detalle: "Nezahualcóyotl y Yecapixtla: dirección, servicios y galería", href: "viveros.dc.html", claves: "vivero viveros nezahualcoyotl yecapixtla planta semilla regalan arbol gratis" },
  { seccion: "Directorio", titulo: "Áreas de SEDEMA", detalle: "Atención ciudadana, DGEIRA, DGSANPAVA e Infraestructura Verde", href: "directorio.dc.html#sedema", claves: "sedema dgeira dgsanpava infraestructura verde telefono correo sede atencion" },
  { seccion: "Directorio", titulo: "Las dieciséis alcaldías", detalle: "Teléfono, correo, dirección y horario", href: "directorio.dc.html#alcaldias", claves: "alcaldia alcaldias iztapalapa coyoacan tlalpan cuauhtemoc benito juarez telefono" },
  { seccion: "Política de arbolado", titulo: "Metas e indicadores", detalle: "Visión, ejes y avance del sexenio", href: "politica.dc.html", claves: "politica metas indicadores vision ejes sexenio programa" },
  { seccion: "Política de arbolado", titulo: "Centro de recursos", detalle: "Documentos, guías, normas y publicaciones", href: "politica.dc.html#recursos", claves: "recursos descargar documento guia norma ley nadf reglamento publicaciones" }
];

const sinAcento = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

class Component extends DCLogic {
  state = { q: "", menu: false };

  renderVals() {
    const activo = this.props.activo ?? "ninguno";
    const q = sinAcento(this.state.q.trim());
    const resultados = q.length < 2 ? [] : INDICE.filter(e =>
      sinAcento(e.titulo + " " + e.detalle + " " + e.seccion + " " + e.claves).indexOf(q) > -1
    ).slice(0, 8);

    return {
      q: this.state.q,
      escribir: e => this.setState({ q: e.target.value }),
      menuAbierto: this.state.menu,
      etiquetaMenu: this.state.menu ? "Cerrar el menú" : "Secciones del sitio",
      signoMenu: this.state.menu ? "▲" : "▼",
      alternarMenu: () => this.setState(s => ({ menu: !s.menu })),
      abierto: q.length >= 2,
      hayResultados: resultados.length > 0,
      sinResultados: q.length >= 2 && resultados.length === 0,
      resultados: resultados,
      secciones: SECCIONES.map(s => {
        const on = s.id === activo;
        return {
          etiqueta: s.etiqueta,
          href: s.href,
          actual: on ? "page" : undefined,
          color: on ? "var(--guinda-100)" : "var(--gris-100)",
          borde: on ? "var(--guinda-100)" : "transparent",
          fondo: on ? "var(--blanco)" : "transparent"
        };
      })
    };
  }
}
</script>
</body>
</html>
